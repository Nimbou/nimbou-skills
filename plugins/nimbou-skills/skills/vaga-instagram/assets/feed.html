<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  body {
    font-family:'Raleway',sans-serif; color:#fff;
    background:
      radial-gradient(900px 700px at 85% 8%, rgba(102,178,123,.28), transparent 60%),
      radial-gradient(1000px 800px at 0% 100%, rgba(76,171,103,.20), transparent 60%),
      linear-gradient(160deg, #173525 0%, #1c4a2e 48%, #1f6933 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:48px 84px 44px;
    position:relative;
  }
  .deco { position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.10); }
  .d1 { width:420px; height:420px; top:-160px; left:-170px; }
  .d2 { width:280px; height:280px; bottom:-100px; right:-90px; }
  .logo { width:290px; margin-bottom:20px; }
  /* h1: no máximo DUAS linhas. */
  h1 {
    font-family:'Montserrat',sans-serif; font-weight:800; text-transform:uppercase;
    font-size:66px; line-height:1.05; text-align:center; letter-spacing:1px;
    margin-bottom:16px;
  }
  h1 .thin { display:block; font-weight:600; font-size:40px; letter-spacing:5px; color:#bfe3cb; margin-top:10px; }
  .empresa {
    font-family:'Montserrat',sans-serif; font-size:42px; font-weight:700;
    color:#fff; text-align:center; margin-bottom:10px;
  }
  .local {
    display:flex; align-items:center; gap:10px;
    font-family:'Montserrat',sans-serif; font-size:28px; font-weight:600;
    text-transform:uppercase; letter-spacing:5px; color:#d9f0e0;
    margin-bottom:26px;
  }
  .local svg { width:30px; height:30px; fill:currentColor; }
  .card {
    width:100%; background:#f7fbf8; color:#173525;
    border-radius:32px; padding:36px 48px;
    display:flex; flex-direction:column; gap:22px;
    box-shadow:0 24px 50px rgba(0,0,0,.28);
  }
  .item { display:flex; align-items:flex-start; gap:26px; }
  .ico {
    flex:0 0 64px; height:64px; border-radius:18px;
    background:rgba(31,105,51,.12); color:#1f6933;
    display:flex; align-items:center; justify-content:center;
  }
  .ico svg { width:34px; height:34px; }
  .item b {
    display:block; font-family:'Montserrat',sans-serif; font-weight:700;
    font-size:24px; letter-spacing:2px; text-transform:uppercase; color:#1f6933;
    margin-bottom:6px; margin-top:3px;
  }
  .item span { font-size:32px; font-weight:600; line-height:1.3; color:#173525; }
  .cta { margin-top:auto; width:100%; text-align:center; }
  .site { font-size:30px; font-weight:600; color:#d9f0e0; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="deco d1"></div><div class="deco d2"></div>
  <img class="logo" src="faepen-logo.png" alt="Fundação FAEPEN">
  <h1>{{TITULO}}<span class="thin">{{FUNCAO}}</span></h1>
  <div class="empresa">{{EMPRESA}}</div>
  <div class="local"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>{{CIDADE}}</div>
  <div class="card">
    <div class="item">
      <div class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg></div>
      <div><b>Cursos</b><span>{{CURSOS}}</span></div>
    </div>
    <div class="item">
      <div class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1H6.32c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg></div>
      <div><b>Bolsa</b><span>{{BOLSA}}</span></div>
    </div>
    <div class="item">
      <div class="ico"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg></div>
      <div><b>Horário</b><span>{{HORARIO}}</span></div>
    </div>
  </div>
  <div class="cta">
    <div class="site">faepen.org.br/vagas · @faepenmt</div>
  </div>
</body>
</html>
