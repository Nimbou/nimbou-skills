<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1350px; overflow:hidden; }
  body {
    font-family:'Raleway',sans-serif; color:#fff;
    background:
      radial-gradient(900px 700px at 85% 8%, rgba(102,178,123,.28), transparent 60%),
      radial-gradient(1000px 800px at 0% 100%, rgba(76,171,103,.20), transparent 60%),
      linear-gradient(160deg, #173525 0%, #1c4a2e 48%, #1f6933 100%);
    display:flex; flex-direction:column; align-items:center;
    padding:48px 84px 44px;
    position:relative;
  }
  .deco { position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.10); }
  .d1 { width:420px; height:420px; top:-160px; left:-170px; }
  .d2 { width:280px; height:280px; bottom:-100px; right:-90px; }
  .logo { width:290px; margin-bottom:20px; }
  h1 {
    font-family:'Montserrat',sans-serif; font-weight:800; text-transform:uppercase;
    font-size:56px; line-height:1.05; text-align:center; letter-spacing:1px;
    margin-bottom:8px;
  }
  .sub { font-size:30px; font-weight:500; color:#a9d7b7; margin-bottom:18px; }
  .card {
    width:100%; background:#f7fbf8; color:#173525;
    border-radius:32px; padding:32px 44px;
    display:flex; flex-direction:column; gap:13px;
    box-shadow:0 24px 50px rgba(0,0,0,.28);
  }
  .unit { display:flex; align-items:baseline; justify-content:space-between; gap:20px; }
  .unit + .unit { border-top:1px solid rgba(23,53,37,.10); padding-top:13px; }
  .unit .nome { font-size:29px; font-weight:600; color:#173525; }
  .unit .hora {
    font-family:'Montserrat',sans-serif; font-weight:700; font-size:24px;
    color:#1f6933; white-space:nowrap;
  }
  .cta { margin-top:auto; width:100%; text-align:center; }
  .site { font-size:30px; font-weight:600; color:#d9f0e0; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="deco d1"></div><div class="deco d2"></div>
  <img class="logo" src="faepen-logo.png" alt="Fundação FAEPEN">
  <h1>{{TITULO_LISTA}}</h1>
  <div class="sub">{{SUBTITULO}}</div>
  <div class="card">
    <!-- Repita .unit por linha. Até ~11 linhas cabem neste corpo; acima disso,
         reduza .nome/.hora ou divida em dois slides. -->
    <div class="unit"><span class="nome">{{NOME}}</span><span class="hora">{{HORA}}</span></div>
  </div>
  <div class="cta">
    <div class="site">faepen.org.br/vagas · @faepenmt</div>
  </div>
</body>
</html>
